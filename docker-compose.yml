# Local stack: Postgres + MinIO + MLflow + Streamlit + FastAPI.
# Usage:
#   cp .env.example .env   # then edit passwords
#   docker compose up -d postgres minio minio-init mlflow
#   docker compose ps
#
# Existing Postgres volumes: create the MLflow DB once manually:
#   docker exec -it surgery_postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
#     -c 'CREATE DATABASE mlflow OWNER CURRENT_USER;'

services:
  postgres:
    image: postgres:16
    container_name: surgery_postgres
    env_file:
      - .env
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_create_mlflow_db.sh:/docker-entrypoint-initdb.d/02_create_mlflow_db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - surgery_network
    restart: always

  minio:
    image: quay.io/minio/minio:latest
    container_name: surgery_minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - ./volumes/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - surgery_network
    restart: always

  # Create MLflow artifact bucket (and any others) on startup
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: surgery_minio_init
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts} || true;
      mc mb -p local/$${MINIO_BUCKET:-surgery-models} || true;
      exit 0;
      "
    networks:
      - surgery_network
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    container_name: surgery_mlflow
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - surgery_network
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: services/streamlit/Dockerfile
    container_name: surgery_streamlit
    env_file:
      - .env
    environment:
      API_BASE_URL: http://fastapi:8000
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./models:/app/models
      - ./.streamlit:/app/.streamlit
    depends_on:
      - fastapi
    networks:
      - surgery_network
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: services/fastapi/Dockerfile
    container_name: surgery_api
    env_file:
      - .env
    environment:
      # Inside Compose, talk to sibling services by name (override host .env)
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_LOAD_FROM_ARTIFACTS: "true"
      MLFLOW_SERVING_MODEL_FAMILY: ${MLFLOW_SERVING_MODEL_FAMILY:-xgboost}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - mlflow
      - minio
    networks:
      - surgery_network
    restart: unless-stopped

networks:
  surgery_network:
    driver: bridge
