# Local orchestration.
services:
  # Streamlit dashboard
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./.streamlit:/app/.streamlit

  # FastAPI prediction service
  api:
    build: .
    command: ["uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
