[project]
name = "surgery-duration-predictor"
version = "1.0.0"
description = "OR surgery duration prediction using Random Forest + TF-IDF/SVD."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "streamlit>=1.33.0",
    "plotly>=5.18.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "optuna>=3.6",
    "mlflow>=2.17,<3",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyter>=1.0",
]
# Dependencies for the surgical_stopwords reference pipeline (offline use only).
# Install with: uv sync --group research
research = [
    "nltk>=3.8",
    "gensim>=4.3",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surgery_duration_predictor"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
